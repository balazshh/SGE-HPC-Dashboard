<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      #login-intro-boot { display: none; }
      .login-intro-pending #login-intro-boot {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: block;
        background: #ffffff;
      }
      :root[data-theme="dark"] #login-intro-boot { background: #000000; }
    </style>
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch {}
      try {
        if (sessionStorage.getItem("play-login-intro") === "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("login-intro-pending");
        }
      } catch {}
    </script>
    <title>SGE HPC Dashboard</title>
    <meta
      name="description"
      content="SGE HPC Dashboard with dashboard, jobs, and history views."
    />
  </head>
  <body>
    <div id="root">
      <div id="login-intro-boot" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
